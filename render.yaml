services:
  - type: web
    name: foodexpress
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: USE_SQLITE
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "False"
