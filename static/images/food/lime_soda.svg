<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="24" fill="url(#grad)" />
  
  <!-- Subtle decorative circles -->
  <circle cx="520" cy="80" r="90" fill="#ffffff" opacity="0.08" />
  <circle cx="80" cy="340" r="110" fill="#ffffff" opacity="0.06" />
  <circle cx="500" cy="320" r="60" fill="#ffffff" opacity="0.08" />

  <!-- Central Card Display -->
  <g transform="translate(300, 160)" text-anchor="middle" filter="url(#shadow)">
    <!-- Food Emoji Badge Background -->
    <circle cx="0" cy="-10" r="75" fill="#ffffff" opacity="0.95" />
    <text x="0" y="24" font-size="78" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif">🍋</text>
  </g>

  <!-- Title &amp; Subtitle Card Container -->
  <g transform="translate(300, 290)" text-anchor="middle">
    <!-- Tag -->
    <rect x="-60" y="-36" width="120" height="26" rx="13" fill="#ffffff" opacity="0.25" /><text x="0" y="-18" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="700" letter-spacing="1">VEG</text>
    <text x="0" y="25" fill="#ffffff" font-size="28" font-family="system-ui, -apple-system, sans-serif" font-weight="800" filter="url(#shadow)">Mint Lime Soda</text>
    <text x="0" y="58" fill="#ffffff" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="500" opacity="0.9">Refreshing bubbly soda with crushed mint &amp; lime</text>
  </g>
</svg>