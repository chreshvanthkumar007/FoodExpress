<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#E91E63" />
    </linearGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="700" height="500" rx="32" fill="url(#heroGrad)" />
  <circle cx="600" cy="100" r="130" fill="#ffffff" opacity="0.1" />
  <circle cx="100" cy="400" r="140" fill="#ffffff" opacity="0.08" />

  <!-- Floating Elements -->
  <g transform="translate(350, 220)" filter="url(#heroShadow)">
    <circle cx="0" cy="0" r="130" fill="#ffffff" opacity="0.95" />
    <text x="0" y="45" font-size="120" text-anchor="middle" font-family="'Segoe UI Emoji', sans-serif">🍔</text>
  </g>

  <!-- Side Floating items -->
  <g transform="translate(160, 140)" filter="url(#heroShadow)">
    <circle cx="0" cy="0" r="65" fill="#ffffff" opacity="0.95" />
    <text x="0" y="25" font-size="60" text-anchor="middle" font-family="'Segoe UI Emoji', sans-serif">🍕</text>
  </g>
  <g transform="translate(540, 160)" filter="url(#heroShadow)">
    <circle cx="0" cy="0" r="65" fill="#ffffff" opacity="0.95" />
    <text x="0" y="25" font-size="60" text-anchor="middle" font-family="'Segoe UI Emoji', sans-serif">🍲</text>
  </g>
  <g transform="translate(180, 360)" filter="url(#heroShadow)">
    <circle cx="0" cy="0" r="60" fill="#ffffff" opacity="0.95" />
    <text x="0" y="22" font-size="55" text-anchor="middle" font-family="'Segoe UI Emoji', sans-serif">🍨</text>
  </g>
  <g transform="translate(520, 350)" filter="url(#heroShadow)">
    <circle cx="0" cy="0" r="60" fill="#ffffff" opacity="0.95" />
    <text x="0" y="22" font-size="55" text-anchor="middle" font-family="'Segoe UI Emoji', sans-serif">🍹</text>
  </g>

  <!-- Banner text badge -->
  <g transform="translate(350, 420)" text-anchor="middle">
    <rect x="-180" y="-24" width="360" height="48" rx="24" fill="#ffffff" />
    <text x="0" y="7" fill="#E91E63" font-size="18" font-family="system-ui, sans-serif" font-weight="800">⚡ 30 MIN EXPRESS DELIVERY</text>
  </g>
</svg>