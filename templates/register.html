{% extends "base.html" %}

{% block title %}Create Account - FoodExpress{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-light text-primary fs-3 mb-2">
            <i class="bi bi-person-plus-fill"></i>
          </div>
          <h3 class="fw-bold">Create FoodExpress Account</h3>
          <p class="text-muted small">Sign up to enjoy express food delivery and discounts</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                <input type="text" name="name" class="form-control border-start-0" placeholder="e.g. Rahul Sharma" required value="{{ request.form.get('name', '') if request.form else '' }}">
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" name="email" class="form-control border-start-0" placeholder="you@example.com" required value="{{ request.form.get('email', '') if request.form else '' }}">
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone text-muted"></i></span>
                <input type="tel" name="phone" class="form-control border-start-0" placeholder="+91 9876543210" required value="{{ request.form.get('phone', '') if request.form else '' }}">
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" name="password" class="form-control border-start-0" placeholder="Min. 6 characters" required>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                <input type="password" name="confirm_password" class="form-control border-start-0" placeholder="Re-enter password" required>
              </div>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Default Delivery Address <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-geo-alt text-muted"></i></span>
                <textarea name="address" rows="3" class="form-control border-start-0" placeholder="Apartment / Flat, Street, Locality, City, Pincode" required>{{ request.form.get('address', '') if request.form else '' }}</textarea>
              </div>
              <div class="form-text small">You can also update or add new addresses at checkout.</div>
            </div>

            <div class="col-12 mt-4">
              <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6">
                Create Account
              </button>
            </div>
          </div>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
          <p class="text-muted small mb-0">
            Already have an account? <a href="{{ url_for('login') }}" class="fw-bold text-primary">Log in here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
