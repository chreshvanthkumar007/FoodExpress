{% extends "base.html" %}

{% block title %}404 - Page Not Found - FoodExpress{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
        <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-light text-primary mx-auto mb-3" style="width: 90px; height: 90px; font-size: 2.8rem;">
          <i class="bi bi-search"></i>
        </div>
        <h1 class="display-4 fw-bold text-dark mb-2">404</h1>
        <h4 class="fw-bold mb-3">Page Not Found</h4>
        <p class="text-muted mb-4">
          Oops! The page or delicious dish you're searching for seems to have been eaten or moved to a new kitchen.
        </p>
        <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
          <a href="{{ url_for('index') }}" class="btn btn-primary-custom px-4 py-2">
            <i class="bi bi-house-door-fill me-1"></i> Back to Home
          </a>
          <a href="{{ url_for('menu') }}" class="btn btn-outline-custom px-4 py-2">
            <i class="bi bi-grid-fill me-1"></i> Explore Menu
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
